# JesusSaves v1.1.1 - CI: invariants, scripture tests, static Windows x86_64 build, release on tag.
name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JS_ROOT: /home/runner/jesussaves-build

jobs:
  invariants:
    name: Project invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check branding, DNS pin, search provider and version
        run: |
          set -eu
          # 1. no Hunix / HuSurf references anywhere (history aside)
          if grep -rIil -e hunix -e husurf --exclude-dir=.git --exclude-dir=.github .; then
            echo "::error::Hunix/HuSurf reference found (files listed above)"; exit 1
          fi
          # 2. Cloudflare family DNS pin must stay exactly 1.1.1.3 / 1.0.0.3
          grep -q '#define JESUSSAVES_DNS_SERVERS "1.1.1.3,1.0.0.3"' netsurf/content/fetchers/curl.c \
            || { echo "::error::DNS pin constant changed"; exit 1; }
          # 3. DuckDuckGo is the only search provider
          n=$(grep -v '^#' netsurf/resources/SearchEngines | grep -c . || true)
          [ "$n" -eq 1 ] && grep -q '^DuckDuckGo|' netsurf/resources/SearchEngines \
            || { echo "::error::SearchEngines must contain exactly one provider: DuckDuckGo"; exit 1; }
          # 4. one version everywhere: version.c, changelog name, useragent, Makefile.defaults
          v=$(sed -n 's/.*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) (based on.*/\1/p' netsurf/desktop/version.c)
          [ -n "$v" ] || { echo "::error::cannot read version from version.c"; exit 1; }
          [ -f "JESUSSAVES_CHANGELOG_v$v.md" ] || { echo "::error::JESUSSAVES_CHANGELOG_v$v.md missing"; exit 1; }
          grep -q "JesusSaves/$v" netsurf/utils/useragent.c || { echo "::error::useragent.c version differs from $v"; exit 1; }
          grep -q "JesusSaves/$v" netsurf/Makefile.defaults || { echo "::error::Makefile.defaults version differs from $v"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match source version v$v"; exit 1
          fi
          echo "OK: version $v"

  scripture-tests:
    name: Scripture parser tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev
      - name: Build and run
        working-directory: netsurf
        run: |
          gcc -std=gnu99 -Wall -Wextra -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -I. -o "$RUNNER_TEMP/test_scripture" ../tools/test_scripture.c \
            desktop/scripture.c desktop/scripture_kjv.c -lz
          "$RUNNER_TEMP/test_scripture"

  windows-static:
    name: Static Windows x86_64 build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 win-iconv-mingw-w64-dev nsis \
            cmake autoconf automake libtool gettext autopoint flex bison pkg-config \
            python3 git make gcc zlib1g-dev

      # Third-party libraries (OpenSSL, curl, c-ares, ...) take most of the time: cache them.
      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.JS_ROOT }}/mw64
            ${{ env.JS_ROOT }}/build/out64
          key: deps-${{ runner.os }}-${{ hashFiles('deps64.sh', 'fetch_deps.sh', 'setup_toolchain.sh') }}

      - name: Fetch third-party sources
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash fetch_deps.sh

      - name: Toolchain glue
        run: bash setup_toolchain.sh

      - name: Build third-party static libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash deps64.sh

      - name: Toolchain glue (regex shim needs TRE)
        run: bash setup_toolchain.sh

      - name: Build NetSurf libraries
        run: bash nslibs64.sh

      - name: Build JesusSaves (exe, installer, libnetsurf.a)
        run: bash nsbuild64.sh package-windows libnetsurf

      - name: Verify the binary
        working-directory: netsurf
        run: |
          set -eu
          OD=x86_64-w64-mingw32-objdump
          # statically linked: only DLLs that ship with Windows may be imported
          allowed=' advapi32.dll bcrypt.dll comctl32.dll comdlg32.dll crypt32.dll gdi32.dll imm32.dll iphlpapi.dll kernel32.dll msimg32.dll msvcrt.dll ole32.dll oleaut32.dll secur32.dll shell32.dll shlwapi.dll user32.dll ws2_32.dll '
          for d in $($OD -p JesusSaves.exe | awk '/DLL Name/ {print tolower($3)}' | sort -u); do
            case "$allowed" in *" $d "*) ;; *) echo "::error::unexpected DLL import: $d"; exit 1;; esac
          done
          # hardening: HIGH_ENTROPY_VA (0x20) | DYNAMIC_BASE (0x40) | NX_COMPAT (0x100)
          dc=$($OD -p JesusSaves.exe | awk '/DllCharacteristics/ {print $2}')
          [ $(( 0x$dc & 0x160 )) -eq $(( 0x160 )) ] || { echo "::error::missing ASLR/DEP flags ($dc)"; exit 1; }
          # stripped: no debug sections
          if [ "$($OD -h JesusSaves.exe | grep -c debug)" -ne 0 ]; then echo "::error::exe is not stripped"; exit 1; fi
          ls -l JesusSaves.exe jesussaves-installer.exe build/Linux-windows/libnetsurf.a

      - name: Smoke test under Wine (non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends wine64 xvfb
          export DISPLAY=:99; Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 2
          # clean environment: an inherited MALLOC_* tuning makes some wine builds abort
          env -i PATH="$PATH" HOME="$HOME" DISPLAY=:99 WINEPREFIX="$RUNNER_TEMP/wine" WINEDEBUG=-all \
            wine64 netsurf/JesusSaves.exe about:welcome >"$RUNNER_TEMP/wine.log" 2>&1 &
          sleep 25
          pgrep -f JesusSaves.exe >/dev/null || { cat "$RUNNER_TEMP/wine.log"; echo "::warning::JesusSaves.exe did not stay running under Wine"; exit 1; }
          echo "JesusSaves.exe running under Wine"

      - name: Package release files
        run: |
          set -eu
          v=$(sed -n 's/.*"\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) (based on.*/\1/p' netsurf/desktop/version.c)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          d=dist; mkdir -p "$d/lib"
          cp netsurf/JesusSaves.exe netsurf/jesussaves-installer.exe "JESUSSAVES_CHANGELOG_v$v.md" "$d/"
          cp netsurf/build/Linux-windows/libnetsurf.a "$JS_ROOT"/mw64/lib/*.a "$d/lib/"
          tar -C "$d" -czf "$d/jesussaves-static-libs_v$v.tar.gz" lib
          rm -rf "$d/lib"
          (cd "$d" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: jesussaves-v${{ env.VERSION }}-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [invariants, scripture-tests, windows-static]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: dist/JESUSSAVES_CHANGELOG_${{ github.ref_name }}.md
          fail_on_unmatched_files: true
